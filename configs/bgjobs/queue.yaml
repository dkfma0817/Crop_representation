spill:
  1:
  - dinov3_attribute_distill_supervised
  0b:
  - dinov3_attribute_distill_r2
  - dinov3_discriminative_region_r3
  0bb:
  - dinov3_discriminative_region_r3
  1bb:
  - dinov3_discriminative_region_r3
  0:
  - dinov3_attribute_distill_supervised_r2
  - dinov3_discriminative_region_r3
jobs:
  dinov3_attribute_distill:
    set:
    - loss.lambda_kd=1.0
  dinov3_attribute_distill_supervised:
    set:
    - loss.lambda_kd=0.0
  dinov3_discriminative_region:
    set:
    - loss.lambda_kd=1.0
    - loss.lambda_rank=auto
  dinov3_attribute_distill_r2:
    set:
    - loss.lambda_kd=1.0
    after: dinov3_attribute_distill
    delete_after_checkpoints: true
  dinov3_attribute_distill_supervised_r2:
    set:
    - loss.lambda_kd=0.0
    after: dinov3_attribute_distill_supervised
    delete_after_checkpoints: true
  dinov3_discriminative_region_r2:
    set:
    - loss.lambda_kd=1.0
    - loss.lambda_rank=auto
    after: dinov3_discriminative_region
    delete_after_checkpoints: true
  dinov3_attribute_distill_r3:
    set:
    - loss.lambda_kd=1.0
    after: dinov3_attribute_distill_r2
  dinov3_discriminative_region_r3:
    parallel_eval: true
    set:
    - loss.lambda_kd=1.0
    - loss.lambda_rank=auto
    after: dinov3_discriminative_region_r2
  dinov3_attribute_distill_r4:
    set:
    - loss.lambda_kd=1.0
    after: dinov3_attribute_distill_r3
  dinov3_discriminative_region_r4:
    set:
    - loss.lambda_kd=1.0
    - loss.lambda_rank=auto
    after: dinov3_discriminative_region_r3
  dinov3_attribute_distill_r5:
    set: &id002
    - loss.lambda_kd=1.0
    after: dinov3_attribute_distill_r4
    repeat: false
  dinov3_discriminative_region_r5:
    set: &id001
    - loss.lambda_kd=1.0
    - loss.lambda_rank=auto
    after: dinov3_discriminative_region_r4
    repeat: false
  dinov3_discriminative_region_r6:
    set: *id001
    after: dinov3_discriminative_region_r5
    repeat: false
  dinov3_attribute_distill_r6:
    set: *id002
    after: dinov3_attribute_distill_r5
    repeat: false
  dinov3_discriminative_region_r7:
    set: *id001
    after: dinov3_discriminative_region_r6
    repeat: false
  dinov3_attribute_distill_r7:
    set: *id002
    after: dinov3_attribute_distill_r6
    repeat: false
  dinov3_attribute_distill_r8:
    set: *id002
    after: dinov3_attribute_distill_r7
    repeat: false
  dinov3_discriminative_region_r8:
    set: *id001
    after: dinov3_discriminative_region_r7
    repeat: true
  dinov3_attribute_distill_r9:
    set: *id002
    after: dinov3_attribute_distill_r8
    repeat: false
  dinov3_attribute_distill_r10:
    set: *id002
    after: dinov3_attribute_distill_r9
    repeat: true
