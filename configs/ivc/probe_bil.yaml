# A. F336 + bilinear ROI sampling on the C0 crop grid (= MSD probe_bil call), no decoder
# Readers R0 + R2 trained in the same process on the same encoder forward (each reader its own init seed 7 / optimizer).
name: ivc_bil
mode: dec
decoder: bilinear
interp: bilinear
seed: 0
epochs: 10
paco_dev_images: 1000
readers:
  - {name: r0, kind: r0}
  - {name: r2, kind: r2, layers: [12]}
